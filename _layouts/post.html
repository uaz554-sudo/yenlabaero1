<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | 顏究所 YEN LAB AERO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 讓後台打的 Markdown 內文有基本的排版美化 */
        .prose h2 { font-size: 1.5rem; font-weight: bold; margin-top: 2rem; margin-bottom: 1rem; }
        .prose p { margin-bottom: 1rem; line-height: 1.8; color: #374151; }
        .prose img { border-radius: 0.5rem; margin: 2rem 0; width: 100%; }
        .prose a { color: #2563eb; text-decoration: underline; }
    </style>
</head>
<body class="bg-[#f0f4f8] font-sans">
    <!-- 導覽列 -->
    <nav class="bg-[#0a192f] text-white p-4">
        <div class="container mx-auto max-w-4xl flex justify-between items-center">
            <a href="/" class="text-xl font-serif text-[#d9e2ec]">YEN LAB AERO 顏究所</a>
            <a href="/" class="text-sm hover:text-[#d9e2ec] transition">← 回到首頁</a>
        </div>
    </nav>

    <!-- 文章內容區 -->
    <main class="container mx-auto max-w-3xl px-4 py-12">
        <div class="bg-white rounded-lg shadow-sm p-8">
            <span class="text-sm font-bold text-blue-600 mb-2 block">{{ page.category }}</span>
            <h1 class="text-3xl font-bold text-gray-900 mb-4">{{ page.title }}</h1>
            <p class="text-gray-400 text-sm mb-8">發布時間：{{ page.date | date: "%Y-%m-%d" }}</p>
            
            {% if page.thumbnail %}
            <img src="{{ page.thumbnail }}" alt="{{ page.title }}" class="w-full h-auto rounded-lg mb-8 object-cover">
            {% endif %}

            <article class="prose max-w-none">
                {{ content }}
            </article>
        </div>
    </main>
</body>
</html>
