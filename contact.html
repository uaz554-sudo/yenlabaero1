<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聯絡編輯 | 顏究所 YEN LAB AERO</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f0f4f8] font-sans flex flex-col min-h-screen">
    
    <!-- 導覽列 -->
    <nav class="bg-[#0a192f] text-white p-4 shadow-md sticky top-0 z-50">
        <div class="container mx-auto max-w-6xl flex justify-between items-center">
            <a href="/" class="text-2xl font-serif font-bold text-[#cba052] flex items-baseline">
                YEN LAB AERO <span class="text-white text-lg ml-2 font-sans">顏究所</span>
            </a>
            <div class="hidden md:flex space-x-8 text-sm font-medium">
                <a href="/aviation.html" class="hover:text-[#cba052] transition">航空資訊</a>
                <a href="/mileage.html" class="hover:text-[#cba052] transition">哩程資訊</a>
                <a href="/credit.html" class="hover:text-[#cba052] transition">信用卡</a>
            </div>
        </div>
    </nav>

    <!-- 聯絡我們 內容區 -->
    <main class="container mx-auto max-w-4xl px-4 py-16 flex-grow">
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-8 md:p-12 flex flex-col md:flex-row gap-12">
            
            <!-- 左側：聯絡資訊 -->
            <div class="md:w-1/2">
                <h1 class="text-3xl font-bold text-[#0a192f] mb-6 border-b-2 border-[#cba052] inline-block pb-2">聯絡編輯團隊</h1>
                <p class="text-gray-600 mb-8 leading-relaxed">
                    無論是新聞線索提供、航空公司公關發布、商業合作提案，或是讀者指教，我們都非常歡迎您與《顏究所》團隊聯繫。
                </p>
                <div class="space-y-6">
                    <div>
                        <h3 class="text-sm font-bold text-gray-400 uppercase tracking-wider mb-1">新聞稿與合作信箱</h3>
                        <a href="mailto:yen.travel@scottt.org" class="text-lg font-bold text-[#0a192f] hover:text-[#cba052] transition">contact@yenlabaero.com</a>
                    </div>
                    <div>
                        <h3 class="text-sm font-bold text-gray-400 uppercase tracking-wider mb-1">社群平台</h3>
                        <p class="text-[#0a192f] font-medium">Facebook 粉絲專頁 (籌備中)</p>
                    </div>
                </div>
            </div>

            <!-- 右側：聯絡表單 -->
            <div class="md:w-1/2 bg-gray-50 p-6 rounded-lg border border-gray-100">
                <form onsubmit="event.preventDefault(); alert('表單已送出（測試模式）！未來可串接表單服務。');" class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">您的姓名 / 單位</label>
                        <input type="text" required class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-[#cba052]">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">聯絡 Email</label>
                        <input type="email" required class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-[#cba052]">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">主旨</label>
                        <select class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-[#cba052] text-gray-700">
                            <option>新聞線索提供</option>
                            <option>商業合作提案</option>
                            <option>文章內容指正</option>
                            <option>其他事項</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">訊息內容</label>
                        <textarea rows="4" required class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-[#cba052]"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-[#0a192f] text-white font-bold py-3 rounded hover:bg-blue-900 transition">發送訊息</button>
                </form>
            </div>

        </div>
    </main>

    <!-- 頁尾 -->
    <footer class="bg-[#0a192f] text-gray-400 py-8 mt-12 border-t-4 border-[#cba052]">
        <div class="container mx-auto max-w-6xl px-4 flex flex-col md:flex-row justify-between items-center text-sm">
            <p>&copy; 2026 YEN LAB AERO 顏究所. All rights reserved.</p>
            <div class="flex space-x-4 mt-4 md:mt-0">
                <a href="/about.html" class="hover:text-white transition">關於我們</a>
                <a href="/contact.html" class="hover:text-white transition text-white">聯絡編輯</a>
                <a href="/privacy.html" class="hover:text-white transition">隱私權政策</a>
            </div>
        </div>
    </footer>

</body>
</html>
